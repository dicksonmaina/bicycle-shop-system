{% extends "base.html" %}
{% block title %}Customer Form - Bicycle Shop{% endblock %}
{% block content %}
<h1>{% if customer %}Edit{% else %}Add{% endif %} Customer</h1>
<form method="POST">
    <input type="text" name="name" placeholder="Name" value="{{ customer.name if customer else '' }}" required>
    <input type="text" name="phone" placeholder="Phone" value="{{ customer.phone if customer else '' }}">
    <input type="email" name="email" placeholder="Email" value="{{ customer.email if customer else '' }}">
    <input type="text" name="address" placeholder="Address" value="{{ customer.address if customer else '' }}">
    <textarea name="notes" placeholder="Notes">{{ customer.notes if customer else '' }}</textarea>
    <button type="submit">Save</button>
</form>
{% endblock %}
