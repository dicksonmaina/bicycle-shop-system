{% extends "base.html" %}
{% block title %}Staff Form - Bicycle Shop{% endblock %}
{% block content %}
<h1>{% if staff %}Edit{% else %}Add{% endif %} Staff</h1>
<form method="POST">
    <input type="text" name="name" placeholder="Name" value="{{ staff.name if staff else '' }}" required>
    <input type="email" name="email" placeholder="Email" value="{{ staff.email if staff else '' }}">
    <input type="text" name="phone" placeholder="Phone" value="{{ staff.phone if staff else '' }}">
    <input type="text" name="role" placeholder="Role" value="{{ staff.role if staff else '' }}">
    <input type="number" step="0.01" name="salary" placeholder="Salary" value="{{ staff.salary if staff else '' }}">
    <input type="date" name="hire_date" value="{{ staff.hire_date.strftime('%Y-%m-%d') if staff and staff.hire_date else '' }}">
    <textarea name="notes" placeholder="Notes">{{ staff.notes if staff else '' }}</textarea>
    <button type="submit">Save</button>
</form>
{% endblock %}
