{% extends "base.html" %}
{% block title %}Supplier Form - Bicycle Shop{% endblock %}
{% block content %}
<h1>{% if supplier %}Edit{% else %}Add{% endif %} Supplier</h1>
<form method="POST">
    <input type="text" name="name" placeholder="Name" value="{{ supplier.name if supplier else '' }}" required>
    <input type="text" name="contact_person" placeholder="Contact Person" value="{{ supplier.contact_person if supplier else '' }}">
    <input type="email" name="email" placeholder="Email" value="{{ supplier.email if supplier else '' }}">
    <input type="text" name="phone" placeholder="Phone" value="{{ supplier.phone if supplier else '' }}">
    <textarea name="address" placeholder="Address">{{ supplier.address if supplier else '' }}</textarea>
    <textarea name="notes" placeholder="Notes">{{ supplier.notes if supplier else '' }}</textarea>
    <button type="submit">Save</button>
</form>
{% endblock %}
